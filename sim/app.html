<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=389801252">
<title>Instagram (fixture)</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  header[role="banner"] { display: flex; justify-content: space-between; padding: 8px; background: #eee; }
  article { border-bottom: 1px solid #ddd; padding: 12px; }
  .sugg { padding: 12px; background: #fafafa; }
  .carousel { display: flex; gap: 8px; overflow-x: auto; }
  #dmlist { height: 300px; overflow: auto; }
  #viewer { height: 500px; overflow: auto; background: #000; color: #fff; position: relative; }
  .slide { height: 500px; }
  #comments { height: 150px; overflow: auto; }
  [role="dialog"] { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px; border-top: 1px solid #ccc; }
  .hidden { display: none; }
  /* a :hover reveal in CSS, like Instagram's stylesheets (the DM row's actions: opacity 0 -> 1 when the row is hovered) */
  #cssactions { opacity: 0; }
  :where(.rowmarker:hover *)#cssactions, .rowmarker:hover #cssactions { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const fr = localStorage.getItem('lang') === 'fr';
  const T = fr ? {
    sponsored: 'Sponsorisé', suggested: 'Suggestions pour vous', suggestedPosts: 'Publications suggérées',
    openApp: "Ouvrir l'application", useApp: "Utiliser l'application", getApp: "Télécharger l'application",
    follow: 'Suivre', thisWeek: 'Cette semaine', seeAll: 'Voir toutes les suggestions',
  } : {
    sponsored: 'Sponsored', suggested: 'Suggested for you', suggestedPosts: 'Suggested posts',
    openApp: 'Open app', useApp: 'Use the app', getApp: 'Get the app',
    follow: 'Follow', thisWeek: 'This week', seeAll: 'See All Suggestions',
  };
  window.__advanced = false; window.__dmTouch = false; window.__liked = false; window.__renders = 0;
  window.__doc = Math.random(); // survives in-page navigation, lost on a full reload

  // The bottom tab bar as Instagram builds it (measured on the phone 2026-10-15): a fixed 50 px bar holding a
  // space-evenly row of 5 slots, each slot wrapping a 48 px link four levels down. Hiding only the Reels link
  // leaves its slot in the row, and space-evenly still spaces for it.
  const TABS = [['/', 'Home'], ['/explore/', 'Explore'], ['/reels/', 'Reels'], ['/direct/inbox/', 'Messages'], ['/me/', 'Profile']];
  const nav = () => `<div id="tabbar" style="position:fixed;left:0;right:0;bottom:0;height:50px;background:#0c1014;z-index:2;display:flex">
    <div id="tabrow" style="display:flex;justify-content:space-evenly;width:100%;height:48px">${TABS.map(([h, l]) =>
      `<div><div style="display:flex"><span style="display:flex"><div style="position:relative"><a data-spa href="${h}" style="display:flex;width:48px;height:48px;align-items:center;justify-content:center;color:#f5f5f5"><svg aria-label="${l}" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg></a></div></span></div></div>`).join('')}</div></div>`;
  const banner = () => `<header role="banner">
    <a data-spa href="/" id="logo">Instagram</a>
    <a href="instagram://app" id="openapp">${T.openApp}</a>
  </header>`;
  const dialog = () => `<div role="dialog" id="appdialog"><p>See more on the app</p><button>${T.useApp}</button><a href="https://apps.apple.com/app/id389801252">${T.getApp}</a></div>`;
  const post = (id, caption, extra = '') => `<article data-id="${id}">${extra}<div><b>user_${id}</b></div><div class="caption">${caption}</div></article>`;

  const views = {
    home() {
      if (localStorage.getItem('lateFeed') === '1') {
        setTimeout(() => document.getElementById('feedwrap')?.insertAdjacentHTML('beforeend',
          `<div class="sugg"><div><h3>${T.suggested}</h3></div><div class="carousel"><a data-spa href="/u1/">user1</a></div></div>`), 100);
        setTimeout(() => document.getElementById('feedwrap')?.insertAdjacentHTML('beforeend', post(1, 'Nice day at the beach') + post(4, 'My cat')), 700);
        return `${nav()}<main><div id="col"><div id="stories">stories tray</div><div id="feedwrap"></div></div></main>`;
      }
      const q = new URLSearchParams(location.search);
      const variant = q.get('variant') || 'home';
      let articles = '';
      articles += post(1, 'Nice day at the beach');
      articles += post(2, `${T.sponsored} ad for shoes`, `<div><span>${T.sponsored}</span></div>`);
      articles += post(3, 'Great run today, thanks to my sponsored ride share');
      articles += `<div class="sugg"><div><h3>${T.suggested}</h3></div><div class="carousel">
        ${[1,2,3,4,5].map(i => `<a data-spa href="/u${i}/">user${i}</a>`).join('')}</div></div>`;
      articles += `<div class="reelsrow"><a data-spa href="/reels/">See all reels</a></div>`;
      articles += post(4, 'My cat');
      articles += post(5, 'Something', `<div><span>${T.suggestedPosts}</span></div>`);
      // an ad whose label text is unknown but whose call-to-action is an off-site link
      articles += post(6, 'Great shoes', `<div><a href="https://l.instagram.com/?u=https%3A%2F%2Fshoes.example%2F"><span>Shop now</span></a></div>`);
      // an organic post with a sensitive-content overlay: a "Learn more" button that goes nowhere off-site
      articles += post(7, 'Sensitive post', `<div><button><span>Learn more</span></button></div>`);
      // a friend's caption, under 40 characters, that merely starts with the ad word: not an ad
      articles += post(8, `${T.sponsored} by my mom lol`);
      // an ad whose label span renders empty and gets its text a moment later (a new text node)
      articles += post(9, 'Late label ad', `<div><span id="latelabel"></span></div>`);
      setTimeout(() => { const l = document.getElementById('latelabel'); if (l) l.textContent = T.sponsored; }, 300);
      const stress = localStorage.getItem('stress') === '1';
      if (stress) for (let i = 10; i < 310; i++) articles += post(i, 'stress post ' + i);
      return `${banner()}${nav()}<main><div id="variant">${variant}</div><section id="feed">${articles}</section></main>${dialog()}`;
    },
    // the search tab: search box on top, recommended grid below (tiles link as /p/ID, /reel/ID or /user/reel/ID)
    explore() {
      const tiles = ['/p/E1/', '/reel/E2/', '/someone/reel/E3/', '/p/E4/', '/someone/p/E5/', '/reels/E6/', '/tv/E7/']
        .map((h) => `<a data-spa href="${h}" style="display:block;width:33%;height:120px;background:#ccc">tile</a>`).join('');
      return `${nav()}<main id="explore"><input id="searchbox" type="text" placeholder="Search"><div id="exploregrid" style="display:flex;flex-wrap:wrap">${tiles}</div></main>`;
    },
    // the search page: a header layer (z-index 11, measured on the phone) holding the box, Cancel and a results
    // list that runs down over the tab bar; Cancel pushes /explore/
    search() {
      const recents = Array.from({ length: 14 }, (_, i) => `<a data-spa href="/explore/search/keyword/?q=r${i}" style="display:block;height:60px">recent ${i}</a>`).join('');
      return `${nav()}<main id="search"><nav style="position:relative;z-index:11;height:69px;background:#0c1014"><input id="searchbox" type="text" placeholder="Search">
        <a data-spa id="cancel" href="/explore/">Cancel</a><div id="results">
        <a data-spa id="acclink" href="/catlover/">catlover</a> <a data-spa id="taglink" href="/explore/tags/cats/">#cats</a>${recents}</div></nav></main>`;
    },
    // results of a keyword search and of a hashtag: grids the user asked for, which must stay visible
    keyword() {
      return `${nav()}<main id="keyword"><div id="kwgrid" style="display:flex;flex-wrap:wrap">
        <a data-spa id="kwreel" href="/reel/K1/" style="display:block;width:33%;height:120px;background:#ccc">reel</a>
        <a data-spa href="/p/K2/" style="display:block;width:33%;height:120px;background:#ccc">post</a></div></main>`;
    },
    tag() {
      return `${nav()}<main id="tag"><div id="taggrid" style="display:flex;flex-wrap:wrap">
        <a data-spa href="/someone/reel/T1/" style="display:block;width:33%;height:120px;background:#ccc">reel</a></div></main>`;
    },
    reelsfeed() { return `${nav()}<main id="reelsfeed"><h2>Reels feed</h2></main>`; },
    // the DM inbox has no tab bar: a Back arrow, the account name, then a list that scrolls inside its own box down to the bottom edge
    inbox() {
      let rows = '';
      for (let i = 0; i < 30; i++) rows += `<div role="button" class="row" style="height:72px">chat ${i}</div>`;
      return `<main id="inbox"><div style="height:60px"><div role="button" aria-label="Back" id="back">&lt;</div>
        <div role="button" id="acct"><span>me</span><svg aria-label="${fr ? 'Icône de chevron vers le bas' : 'Down chevron icon'}" width="12" height="12"><title>${fr ? 'Icône de chevron vers le bas' : 'Down chevron icon'}</title></svg></div></div>
        <div id="inboxlist" style="position:absolute;top:60px;bottom:0;left:0;right:0;overflow:auto">
        <a data-spa id="marie" href="/direct/t/1/">Marie</a>${rows}<div role="button" class="row" id="lastrow" style="height:72px">oldest chat</div></div></main>`;
    },
    dm() {
      let msgs = '';
      for (let i = 0; i < 40; i++) msgs += `<div class="msg">message ${i}</div>`;
      msgs += `<div class="msg"><a data-spa id="reellink" href="/reel/ABC123/">Reel from Marie</a></div>`;
      msgs += `<div class="msg"><div role="button" id="reelcard">Reel from Paul (opens as an overlay)</div></div>`;
      // a post shared in the thread: its message row reveals React / Reply / More on hover (measured on the phone)
      msgs += `<div class="msg"><a id="appstorelink" href="https://apps.apple.com/ca/app/some-game/id123456789">apps.apple.com/ca/app/some-game</a></div>`;
      msgs += `<div role="group" class="textrow" id="textmsg" style="height:50px"><div id="textbubble">hey, what's up</div><div data-actions style="visibility:hidden">React Reply</div></div>`;
      msgs += `<div class="msg rowfirst" style="height:40px">message just before the shared post</div>`;
      msgs += `<div role="group" id="sharedmsg" class="rowmarker" style="min-height:120px"><a data-spa id="sharedpost" href="/p/S1/" style="display:block;height:100px">post shared by Marie</a>
        <div id="msgactions" style="visibility:hidden"><span>React</span> <span>Reply</span></div><div id="msgtext" style="height:40px">caption under the post</div><div id="sharedcaption" style="height:30px;cursor:pointer">sistosterone: open the post</div><div id="cssactions">More</div></div>`;
      return `<main id="dm"><div style="height:40px">Marie</div><div id="dmlist">${msgs}</div></main>`;
    },
    reel(id) {
      // native vertical scroller holding the current reel and the next one, like Instagram's reel feed
      return `<main id="reel"><div id="viewer"><div class="slide"><video id="v" muted playsinline></video><div>reel ${id}</div>
        <button id="like">Like</button><div id="caption" style="height:60px;overflow:auto">${'<p>caption line</p>'.repeat(12)}</div></div><div class="slide">next reel</div></div><div id="comments">${'<p>comment</p>'.repeat(30)}</div></main>`;
    },
    // notifications (structure measured on the phone): activity sections, then at the end a "Suggested for you"
    // heading, a list of accounts with Follow buttons (one row's reason line also says "Suggested for you") and a
    // "See All Suggestions" link to /explore/people/; an activity row can have a Follow button too
    // notifLayout=nested: the heading sits inside the activity block (rows show "Following", no Follow button),
    // the account list is that block's sibling; nothing above the heading's own wrappers may be hidden
    notifications() {
      const rows = `<div><span>${T.thisWeek}</span></div><div id="n1"><span>marie liked your post</span></div>`;
      if (localStorage.getItem('notifLayout') === 'nested') return `${nav()}<main id="notifs"><div id="nlist"><div id="act">${rows}
        <div id="n2"><span>paul started following you</span><div role="button">Following</div></div><div id="shead"><h4>${T.suggested}</h4></div></div></div></main>`;
      return `${nav()}<main id="notifs"><div id="nlist">${rows}
        <div id="n2"><span>paul started following you</span><div role="button">${T.follow}</div></div>
        <div id="shead"><h4>${T.suggested}</h4></div></div></main>`;
    },
    // the account list arrives after its heading, as on the phone
    notificationsLate() {
      document.getElementById('nlist')?.insertAdjacentHTML('beforeend', `<div id="slist"><div><span>acc1</span><span>${T.suggested}</span><div role="button">${T.follow}</div></div>
          <div><span>acc2</span><span>Followed by x</span><div role="button">${T.follow}</div></div></div>
        <div id="sall"><a data-spa href="/explore/people/">${T.seeAll}</a></div>`);
      setTimeout(() => document.getElementById('nlist')?.insertAdjacentHTML('beforeend', `<div id="slate"><span>acc3</span><div role="button">${T.follow}</div></div>`), 1500);
    },
    other() { return `${nav()}<main id="other">page</main>`; },
  };

  const render = () => {
    window.__renders++;
    const p = location.pathname;
    let html;
    if (p === '/') html = views.home();
    else if (/^\/explore\/?$/.test(p)) html = views.explore();
    else if (p.startsWith('/explore/search/keyword')) html = views.keyword();
    else if (p.startsWith('/explore/search')) html = views.search();
    else if (p.startsWith('/explore/')) html = views.tag();
    else if (/^\/reels\/?$/.test(p)) html = views.reelsfeed();
    else if (/^\/(?:[^/]+\/)?reels?\/([^/]+)/.test(p)) html = views.reel(RegExp.$1);
    else if (p === '/direct/inbox/') html = views.inbox();
    else if (p.startsWith('/direct/t/')) html = views.dm();
    else if (p.startsWith('/notifications')) { html = views.notifications(); setTimeout(views.notificationsLate, 400); }
    else html = views.other();
    document.getElementById('root').innerHTML = html;
    wire();
  };

  const wire = () => {
    for (const a of document.querySelectorAll('a[data-spa]')) {
      a.addEventListener('click', (e) => { e.preventDefault(); history.pushState(null, '', a.getAttribute('href')); render(); });
    }
    // tapping the search box on the search tab opens the search page; Enter runs a keyword search
    const box = document.getElementById('searchbox');
    if (box && location.pathname === '/explore/') box.addEventListener('focus', () => {
      history.pushState(null, '', '/explore/search/'); render(); document.getElementById('searchbox').focus();
    });
    if (box && location.pathname.startsWith('/explore/search')) box.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { history.pushState(null, '', '/explore/search/keyword/?q=' + encodeURIComponent(box.value)); render(); }
    });
    const viewer = document.getElementById('viewer');
    if (viewer) {
      let y0 = null;
      // a swipe inside the reel's own scrollable caption scrolls the caption, not the reels
      viewer.addEventListener('touchstart', (e) => { y0 = e.target.closest('#caption') ? null : e.touches[0].clientY; });
      viewer.addEventListener('touchmove', (e) => {
        if (y0 !== null && y0 - e.touches[0].clientY > 30) { y0 = null; advance(); }
      });
      viewer.addEventListener('wheel', (e) => { if (e.deltaY > 30) advance(); });
      viewer.addEventListener('scroll', () => { if (viewer.scrollTop > 250) advance(); });
      document.getElementById('like').addEventListener('click', () => { window.__liked = true; });
      window.__captionMoveSeen = false;
      document.getElementById('caption').addEventListener('touchmove', () => { window.__captionMoveSeen = true; });
      // the comments sheet records whether touch moves reach it (the lock must not swallow them)
      window.__commentsMoveSeen = false;
      document.getElementById('comments').addEventListener('touchmove', () => { window.__commentsMoveSeen = true; });
    }
    const dmlist = document.getElementById('dmlist');
    if (dmlist) {
      dmlist.addEventListener('touchmove', () => { window.__dmTouch = true; });
      dmlist.addEventListener('scroll', () => { window.__dmTouch = true; });
    }
    // a reel shared in a DM opens as an overlay on top of the thread: no URL change, a scroll box of reels
    const card = document.getElementById('reelcard');
    if (card) card.addEventListener('click', () => {
      window.__oadvanced = false;
      const ov = document.createElement('div');
      ov.setAttribute('role', 'dialog'); ov.id = 'overlay';
      ov.style.cssText = 'position:fixed;inset:0;background:#000;color:#fff;z-index:10';
      ov.innerHTML = `<div id="oviewer" style="height:100%;overflow:auto"><div class="oslide" style="height:100%"><video muted playsinline style="display:block;width:100%;height:95%"></video><button id="olike">Like</button></div><div class="oslide" style="height:100%">next reel</div></div><button id="oclose" style="position:absolute;top:8px;right:8px">Close</button>`;
      document.body.appendChild(ov);
      const ovw = document.getElementById('oviewer');
      let y0 = null;
      ovw.addEventListener('touchstart', (e) => { y0 = e.touches[0].clientY; });
      ovw.addEventListener('touchmove', (e) => { if (y0 !== null && y0 - e.touches[0].clientY > 30) { y0 = null; window.__oadvanced = true; } });
      ovw.addEventListener('scroll', () => { if (ovw.scrollTop > 250) window.__oadvanced = true; });
      document.getElementById('oclose').addEventListener('click', () => ov.remove());
    });
  };
  const advance = () => {
    window.__advanced = true;
    history.pushState(null, '', '/reel/DEF456/');
    render();
  };

  // like React, hover handlers are delegated to the root container; a hover on a message row reveals its actions
  // (iOS Safari then treats the tap as a hover and does not click: the post needs a second tap)
  window.__hoverRevealed = false;
  let rootEl0;
  // React's enter/leave: an over event whose relatedTarget is React-managed is skipped, because the enter was already
  // dispatched from that element's out event (out: from = target, to = relatedTarget). So the reveal comes from
  // mouseout of the previously hovered element as well as from mouseover when coming from outside.
  window.__textRevealed = false;
  const reveal = (to) => {
    const g = to && to.closest && to.closest('#sharedmsg'); if (g) { window.__hoverRevealed = true; g.querySelector('#msgactions').style.visibility = 'visible'; }
    const t = to && to.closest && to.closest('#textmsg'); if (t) { window.__textRevealed = true; t.querySelector('[data-actions]').style.visibility = 'visible'; }
  };
  rootEl0 = document.getElementById('root');
  rootEl0.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('#sharedcaption')) { history.pushState(null, '', '/p/S1/'); render(); } });
  const rootEl = document.getElementById('root');
  for (const t of ['mouseover', 'pointerover']) rootEl.addEventListener(t, (e) => { if (!(e.relatedTarget && rootEl.contains(e.relatedTarget))) reveal(e.target); });
  for (const t of ['mouseout', 'pointerout']) rootEl.addEventListener(t, (e) => reveal(e.relatedTarget));
  // ignorePopstate=1 models a router that ignores script-made popstate events (only real Back/Forward)
  window.addEventListener('popstate', (e) => { if (localStorage.getItem('ignorePopstate') === '1' && !e.isTrusted) return; render(); });
  render();
  // Instagram sometimes rewrites the URL after load (drops the query). Simulated when strip=1.
  if (localStorage.getItem('strip') === '1' && location.search) setTimeout(() => history.replaceState(null, '', '/'), 100);
  // Stress: keep mutating the feed for 2 s.
  if (localStorage.getItem('stress') === '1') {
    let n = 0;
    const t = setInterval(() => {
      const el = document.querySelector('article[data-id="1"] .caption');
      if (el) el.textContent = 'Nice day at the beach ' + (n++);
      if (n >= 40) clearInterval(t);
    }, 50);
  }
})();
</script>
</body>
</html>
