<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2,shrink-to-fit=no">
<title>Instagram Call (fixture)</title>
<!-- like Instagram's call page: served with a nonce-only script policy (server.py); its first script reads the user agent -->
<script nonce="t3st">window.__uaAtFirstScript = navigator.userAgent; window.__platformAtFirstScript = navigator.platform;</script>
</head>
<body>
<style>#controls { opacity: 0; } #stage:hover #controls { opacity: 1; }</style>
<div id="stage" style="height:300px"><div id="lobby">Ready to call? <div role="button" id="startcall">Start call</div></div>
<div id="controls"><div role="button">Hang up</div></div></div>
</body>
</html>
