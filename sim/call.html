<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2,shrink-to-fit=no">
<title>Instagram Call (fixture)</title>
<!-- like Instagram's call page: served with a nonce-only script policy (server.py); its first script reads the user agent -->
<script nonce="t3st">window.__uaAtFirstScript = navigator.userAgent; window.__platformAtFirstScript = navigator.platform;
// a small module registry like Instagram's: its call gate computes its answers once, when its bundle arrives, from the
// user agent it sees then; pre=1 = as if computed from the iPhone identity before the script could act (measured)
(() => { const mods = {}, waiting = [];
  const pre = new URLSearchParams(location.search).get('pre') === '1';
  const frozen = new URLSearchParams(location.search).get('frozen') === '1'; // a module whose exports cannot be replaced
  const define = () => { const ok = !pre && /Macintosh/.test(navigator.userAgent);
    mods.RTWebIncomingRingConfiguration = { isSupportedClient() { return ok; }, isSupportedOutboundClient() { return ok; } };
    if (frozen) Object.freeze(mods.RTWebIncomingRingConfiguration); };
  window.require = (n) => mods[n];
  window.requireLazy = (names, cb) => { if (names.every((n) => mods[n])) cb(...names.map((n) => mods[n])); else waiting.push([names, cb]); };
  setTimeout(() => { define(); for (const [names, cb] of waiting.splice(0)) cb(...names.map((n) => mods[n])); }, 200);
})();</script>
</head>
<body>
<style>body { margin: 0; } #controls { opacity: 0; } #stage:hover #controls { opacity: 1; }</style>
<!-- the call lobby as Instagram lays it out (measured on the phone): a fixed 1024 px row, centred in a screen-wide box
     that hides overflow: the camera preview (656 px) and the panel with "Ready to call? / Start call" (348 px) -->
<div id="screen" style="position:absolute;left:0;top:0;width:100%;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center">
  <div id="wide" style="width:1024px;flex-shrink:0;display:flex;flex-direction:row">
    <div id="stage" style="width:656px;height:300px;background:#222;color:#fff;display:flex;flex-direction:column;justify-content:space-between">Camera off
      <div id="previewbtns" style="display:flex;flex-direction:row;width:100%;height:48px"><div role="button" id="mutebtn" style="width:40px;height:40px">Mic</div>
        <div role="button" id="speakerbtn" style="width:40px;height:40px">Spk</div><div role="button" id="settingsbtn" style="width:40px;height:40px">Set</div></div>
      <div id="controls"><div role="button">Hang up</div></div></div>
    <div id="panel" style="width:348px;height:300px"><div id="lobby">F Ready to call? <div role="button" id="startcall" style="display:inline-block;width:88px;height:28px">Start call</div></div></div>
  </div>
</div>
<script nonce="t3st">
// latepanel=1: the panel mounts 400 ms after the row was first laid out (as React may do)
if (new URLSearchParams(location.search).get('latepanel') === '1') { const p = document.getElementById('panel'); p.remove(); setTimeout(() => document.getElementById('wide').append(p), 400); }
</script>
</body>
</html>
